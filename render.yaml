# ── Blueprint Render ──────────────────────────────────────
# La base de données est hébergée sur Neon (PostgreSQL gratuit permanent),
# PAS sur Render. DATABASE_URL est donc défini MANUELLEMENT dans le dashboard
# (Environment) → sync:false empêche Render de l'écraser.
services:
  - type: web
    name: justepargne-api
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        sync: false        # défini à la main (URL Neon) — Render n'y touche pas
      - key: PGSSL
        value: require
      - key: JWT_SECRET
        generateValue: true
